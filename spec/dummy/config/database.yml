# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem 'sqlite3'
#
default: &default
  adapter: <%= ENV.fetch("DATABASE_ADAPTER", "sqlite3") %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

postgres: &postgres
  <<: *default
  adapter: postgresql
  host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
  port: <%= ENV.fetch("POSTGRES_PORT", "5432") %>
  username: <%= ENV.fetch("POSTGRES_USER", "postgres") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "postgres") %>

development:
  <<: *default
  database: db/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *<%= ENV.fetch("DATABASE_ADAPTER", "sqlite3") == "postgresql" ? "postgres" : "default" %>
  database: <%= ENV.fetch("POSTGRES_DB", "association_scope_test") if ENV["DATABASE_ADAPTER"] == "postgresql" %><%= "db/test.sqlite3" unless ENV["DATABASE_ADAPTER"] == "postgresql" %>

production:
  <<: *default
  database: db/production.sqlite3
