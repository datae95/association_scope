name: standard

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Run Standard
        run: bundle exec standardrb

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Build gem
        run: gem build association_scope.gemspec
      - name: Inspect packaged gem
        run: |
          gem specification association_scope-*.gem name
          gem specification association_scope-*.gem version
          gem specification association_scope-*.gem files
